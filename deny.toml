# cargo-deny configuration.
# Review cadence: re-check this file whenever dependencies change and at each
# release. The allow-lists are intentionally permissive: every dependency in
# Cargo.lock is MIT-compatible under the licenses allowed below.

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-pc-windows-gnu",
    "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
# The only non-vulnerability warning kept: `paste` is unmaintained but has no
# fix and no known vulnerability; it is a transitive build-time dependency of
# fastembed's tokenizers stack. Reviewed 2026-11-08.
ignore = ["RUSTSEC-2024-0436"]
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
]
confidence-threshold = 0.9
exceptions = []

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = [
    # Both crates have known soundness or maintenance problems and are not
    # used by this workspace; fail if a future dependency pulls them in.
    { name = "openssl" },
    { name = "openssl-sys" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
