[package]
name = "recall-core"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "Pure domain layer for Recall-MCP: models, SQLite store with FTS5, embedders, explainable hybrid scorer"

[dependencies]
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
base64 = "0.22"
chacha20poly1305 = "0.11"
hex = "0.4"
hmac = "0.13"
sha2 = "0.11"
fastembed = { version = "6", default-features = false, features = [
    "ort-load-dynamic",
    "hf-hub-rustls-tls",
], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }

[dev-dependencies]
tempfile = "3"
criterion = "0.8"

[[bench]]
name = "recall_latency"
harness = false

[features]
default = []
# Optional OpenAI-compatible embedding client (ADR-003).
openai = ["dep:reqwest"]
# Optional local ONNX embeddings via fastembed/ort (D-013). Requires
# onnxruntime.dll at runtime (ORT_DYLIB_PATH) — see docs/adr/DECISIONS.md.
onnx = ["dep:fastembed"]
