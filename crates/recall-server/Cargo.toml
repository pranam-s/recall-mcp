[package]
name = "recall-server"
version = "0.3.1"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "HTTP API and MCP transports (stdio, streamable-HTTP) for Recall-MCP"

[dependencies]
recall-core = { workspace = true }
axum = { workspace = true }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
subtle = { workspace = true }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
mime = "0.3"
proptest = "1"
