[package]
name = "recall-mcp-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/recall-mcp-cli"
description = "CLI for Recall-MCP: serve (HTTP + MCP), remember, recall, export, import"
categories = ["command-line-utilities", "api-bindings"]
keywords = ["mcp", "memory", "cli", "agent"]
readme = "../../README.md"
include = ["src/**", "tests/**", "LICENSE", "../../README.md"]

[dependencies]
recall-core = { workspace = true }
recall-server = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[features]
default = []
# Forward the optional embedders to the binary so `--embedder onnx|openai`
# can actually be served (D-003, D-013).
onnx = ["recall-core/onnx"]
openai = ["recall-core/openai"]
