name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example v0.5.0)"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify version and gates
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Resolve tag and version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Verify every version pin
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          grep -q "^version = \"$V\"$" Cargo.toml
          grep -q "\"version\": \"$V\"" crates/recall-server/src/openapi.json
          grep -q "version = \"$V\"" crates/recall-server/src/mcp.rs
          grep -q "version: $V" CITATION.cff
          grep -q "\"version\": \"$V\"" server.json
          test -f "releases/NOTES-$V.md"
          echo "version pins agree on $V"
      - name: Gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --locked
          cargo test --workspace --doc --locked

  publish:
    name: Publish crates.io packages
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Publish core, then server, then cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          wait_for_crate() {
            local crate="$1" version="$2"
            for _ in $(seq 1 60); do
              if curl -fsS -H "User-Agent: recall-mcp-release" \
                "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null; then
                echo "${crate} ${version} is available on crates.io"
                return 0
              fi
              sleep 5
            done
            echo "timed out waiting for ${crate} ${version} to reach the crates.io index" >&2
            return 1
          }
          cargo publish -p recall-mcp-core --locked
          wait_for_crate recall-mcp-core "$VERSION"
          cargo publish -p recall-mcp-server --locked
          wait_for_crate recall-mcp-server "$VERSION"
          cargo publish -p recall-mcp-cli --locked
          wait_for_crate recall-mcp-cli "$VERSION"

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: recall-mcp-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: recall-mcp-windows-x86_64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: recall-mcp-macos-aarch64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build -p recall-mcp-cli --release --locked --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/recall dist/
          cp target/${{ matrix.target }}/release/recall-cli dist/
          cp LICENSE README.md dist/
          tar -C dist -czf ${{ matrix.archive }} .
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/recall.exe dist/
          Copy-Item target/${{ matrix.target }}/release/recall-cli.exe dist/
          Copy-Item LICENSE,README.md dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive }}
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ matrix.archive }}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  sbom:
    name: SBOM
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cargo-cyclonedx
      - run: cargo cyclonedx --format json --all
      - run: find . -name '*.cdx.json' -print -exec cp {} . \;
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: sbom
          path: "*.cdx.json"

  release:
    name: GitHub release
    needs: [verify, publish, build, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find artifacts -type f)
          gh release create "$TAG" \
            --title "Recall-MCP $VERSION" \
            --notes-file "releases/NOTES-$VERSION.md" \
            "${FILES[@]}"
