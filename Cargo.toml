[workspace]
resolver = "3"
members = ["crates/recall-core", "crates/recall-server", "crates/recall-cli"]

[workspace.package]
license = "MIT"
repository = "https://github.com/pranam/recall-mcp"

[workspace.dependencies]
recall-core = { path = "crates/recall-core" }
recall-server = { path = "crates/recall-server" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "fs", "trace"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal"] }
rmcp = { version = "3.2", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "schemars"] }
schemars = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
subtle = "2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
